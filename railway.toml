# Railway Configuration for MCP-Debugger-Browserless
# Docs: https://docs.railway.com/guides/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Number of replicas (1 for this deployment)
numReplicas = 1

# Keep service always running (required for MCP server)
sleepApplication = false

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check configuration
healthcheckPath = "/health"
healthcheckTimeout = 300

# Start command (optional - Dockerfile already defines CMD)
# Uncomment if you need to override Dockerfile CMD
# startCommand = "node dist/http-server-v3.js"

# Note: Railway will automatically set the PORT environment variable
# The app listens on process.env.PORT which Railway provides
